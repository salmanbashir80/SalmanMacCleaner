name: CI

# Build + test the macOS application (8002CleanUp) and produce a downloadable,
# correctly packaged .app artifact.
#
# Notes:
#  * The app is a full-disk maintenance utility, so it must NOT be built with
#    App Sandbox enabled (see SalmanMacCleaner.entitlements); the structural
#    validator enforces that.
#  * The .app is packaged with `ditto -c -k --keepParent` (never `zip -r`),
#    because `zip` follows symlinks and corrupts .app bundles.
#  * No GitHub Release is created from a main-push run. Releases are made by
#    release.yml from an explicit tag, so release names always match the real
#    product version instead of a CI run number.

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build & Test (macOS, arm64)
    runs-on: macos-14
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null \
          || sudo xcode-select -s /Applications/Xcode_15.2.app 2>/dev/null \
          || sudo xcode-select -s /Applications/Xcode.app
        xcodebuild -version

    - name: Show Xcode project targets
      run: xcodebuild -project SalmanMacCleaner.xcodeproj -list

    - name: Resolve Swift packages
      run: xcodebuild -resolvePackageDependencies -project SalmanMacCleaner.xcodeproj -scheme SalmanMacCleaner

    - name: Structural validation (no Xcode required)
      run: python3 Tools/validate_project.py

    - name: Swift syntax parse (tree-sitter)
      run: |
        python3 -m pip install --quiet --disable-pip-version-check tree_sitter tree_sitter_swift
        python3 Tools/parse_check.py

    - name: Cross-reference heuristics (informational)
      run: python3 Tools/xref_check.py || true

    - name: Run unit tests
      run: |
        set -o pipefail
        xcodebuild test \
          -project SalmanMacCleaner.xcodeproj \
          -scheme SalmanMacCleaner \
          -destination 'platform=macOS' \
          CODE_SIGNING_ALLOWED=NO \
          2>&1 | tee mac_test.log

    - name: Upload test log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mac-test-log
        path: mac_test.log
        if-no-files-found: ignore

    - name: Build Release (ad-hoc signed, unsigned fallback)
      id: release_build
      run: |
        set -o pipefail
        if xcodebuild build \
             -project SalmanMacCleaner.xcodeproj \
             -scheme SalmanMacCleaner \
             -configuration Release \
             -destination 'platform=macOS' \
             -derivedDataPath build_mac \
             CODE_SIGN_IDENTITY="-" \
             CODE_SIGN_STYLE=Manual \
             DEVELOPMENT_TEAM="" \
             2>&1 | tee release_build.log; then
          echo "signing=ad-hoc" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Ad-hoc signing failed - rebuilding unsigned. An unsigned app needs manual Gatekeeper approval on first launch."
          xcodebuild build \
            -project SalmanMacCleaner.xcodeproj \
            -scheme SalmanMacCleaner \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build_mac \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee release_build.log
          echo "signing=none" >> "$GITHUB_OUTPUT"
        fi

    - name: Verify the built app bundle
      run: |
        APP="build_mac/Build/Products/Release/SalmanMacCleaner.app"
        test -d "$APP" || { echo "::error::app bundle was not produced at $APP"; exit 1; }
        echo "Signing: ${{ steps.release_build.outputs.signing }}"
        /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$APP/Contents/Info.plist"
        /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Contents/Info.plist"
        /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
        /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist"
        /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist"
        if codesign --verify --deep --strict --verbose=2 "$APP"; then
          echo "code signature: valid (ad-hoc)"
        else
          echo "::warning::app bundle is not code-signed; it will need manual Gatekeeper approval"
        fi
        du -sh "$APP"

    - name: Package app (symlink-safe ditto) and checksum
      run: |
        MARKETING_VERSION=$(grep -m1 'MARKETING_VERSION' SalmanMacCleaner.xcodeproj/project.pbxproj | sed 's/.*= *//; s/;//')
        BUILD_NUMBER=$(grep -m1 'CURRENT_PROJECT_VERSION' SalmanMacCleaner.xcodeproj/project.pbxproj | sed 's/.*= *//; s/;//')
        NAME="8002CleanUp-${MARKETING_VERSION}-build${BUILD_NUMBER}-macos.zip"
        echo "Packaging $NAME"
        mkdir -p dist
        cp -R build_mac/Build/Products/Release/SalmanMacCleaner.app dist/
        # ditto keeps symlinks and extended attributes intact inside the .app
        ditto -c -k --keepParent dist/SalmanMacCleaner.app "dist/$NAME"
        cd dist && shasum -a 256 "$NAME" | tee checksums.txt

    - name: Upload packaged app
      uses: actions/upload-artifact@v4
      with:
        name: 8002CleanUp-macos-app
        path: |
          dist/*.zip
          dist/checksums.txt
        if-no-files-found: error

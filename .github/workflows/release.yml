name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build'
        required: true
        default: 'v1.3.0'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish unsigned release
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Resolve Swift packages
        run: |
          xcodebuild -project SalmanMacCleaner.xcodeproj \
            -scheme SalmanMacCleaner -resolvePackageDependencies

      - name: Archive (Release, arm64, unsigned)
        run: |
          xcodebuild \
            -project SalmanMacCleaner.xcodeproj \
            -scheme SalmanMacCleaner \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -archivePath build/SalmanMacCleaner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Export app
        run: |
          mkdir -p dist
          cp -R build/SalmanMacCleaner.xcarchive/Products/Applications/SalmanMacCleaner.app dist/

      - name: Create release ZIP
        run: |
          ditto -c -k --keepParent dist/SalmanMacCleaner.app dist/SalmanMacCleaner-${{ steps.tag.outputs.version }}.zip
          shasum -a 256 dist/SalmanMacCleaner-${{ steps.tag.outputs.version }}.zip | tee dist/checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            "dist/SalmanMacCleaner-${{ steps.tag.outputs.version }}.zip" \
            "dist/checksums.txt" \
            --repo salmanbashir80/SalmanMacCleaner \
            --title "Salman Mac Cleaner ${{ steps.tag.outputs.version }}" \
            --notes-file CHANGELOG.md \
            || true

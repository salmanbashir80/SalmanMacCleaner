name: CI

on:
  push:
    branches: [ "arena/01a03f44-salmanmaccleaner", "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Show Xcode Build Version
      run: xcodebuild -version

    - name: Show Xcode Build List
      run: xcodebuild -project SalmanMacCleaner.xcodeproj -list

    - name: Resolve Swift Packages
      run: xcodebuild -resolvePackageDependencies -project SalmanMacCleaner.xcodeproj -scheme SalmanMacCleaner

    - name: Run Unit Tests
      run: xcodebuild test -project SalmanMacCleaner.xcodeproj -scheme SalmanMacCleanerTests -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO | xcpretty

    - name: Build Debug
      run: xcodebuild build -project SalmanMacCleaner.xcodeproj -scheme SalmanMacCleaner -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO | xcpretty

    - name: Build Release (Unsigned)
      run: |
        xcodebuild build -project SalmanMacCleaner.xcodeproj -scheme SalmanMacCleaner -configuration Release -destination 'platform=macOS' -derivedDataPath build_mac CODE_SIGNING_ALLOWED=NO | xcpretty
        
    - name: Package Mac Application
      run: |
        mkdir -p payload
        cp -R build_mac/Build/Products/Release/SalmanMacCleaner.app payload/
        cd payload
        zip -r ../SalmanMacCleaner-macOS.zip SalmanMacCleaner.app
        cd ..

    - name: Create GitHub Release
      if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v1
      with:
        files: SalmanMacCleaner-macOS.zip
        tag_name: "v1.0.${{ github.run_number }}"
        name: "SalmanMacCleaner Release v1.0.${{ github.run_number }}"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

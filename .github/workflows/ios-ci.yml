name: iOS CI

on:
  push:
    branches: [ "main", "arena/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.4.app

    - name: List Xcode project
      run: xcodebuild -project SalmanCleanerMobile.xcodeproj -list

    - name: Build iOS App
      run: |
        xcodebuild \
          -project SalmanCleanerMobile.xcodeproj \
          -scheme SalmanCleanerMobile \
          -configuration Debug \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
          CODE_SIGNING_ALLOWED=NO \
          build
